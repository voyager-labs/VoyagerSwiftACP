defaults:
  - env: dev
  - db: sqlite
  - _self_

app:
  name: voyager

# LLM 설정 (LangChain 기반)
llm:
  provider: ollama  # ollama, openai, anthropic
  model: qwen2.5:7b
  temperature: 0.7

  # Provider별 설정
  ollama:
    base_url: http://localhost:11434

  openai:
    api_key: ${OPENAI_API_KEY:}

  anthropic:
    api_key: ${ANTHROPIC_API_KEY:}
