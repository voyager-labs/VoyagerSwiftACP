repos:
  # Keep uv.lock in sync with pyproject.toml (official uv hook)
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.8.15
    hooks:
      - id: uv-lock
        args: ["--frozen"]

  # Ruff: formatter and linter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.12
    hooks:
      - id: ruff-format
        types_or: [python, pyi]
      - id: ruff-check
        args: ["--fix", "--exit-non-zero-on-fix"]

  # Type checker: pyright (strict)
  - repo: local
    hooks:
      - id: pyright
        name: pyright (strict)
        entry: uv
        args: ["run", "pyright"]
        language: system
        types_or: [python, pyi]
        stages: [pre-commit, pre-push]

  # Strip outputs from Jupyter notebooks
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
        files: "\\.ipynb$"
