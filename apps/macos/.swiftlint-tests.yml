# SwiftLint settings for Voyager macOS test sources.
# Test suites keep regular lint coverage but skip metrics and naming checks that are noisy for AC matrices.
parent_config: .swiftlint.yml

disabled_rules:
  - todo
  - opening_brace
  - closure_body_length
  - trailing_comma
  - file_name
  - file_length
  - function_body_length
  - function_default_parameter_at_end
  - line_length
  - modifier_order
  - multiline_literal_brackets
  - single_test_class
  - type_body_length
  - type_name
