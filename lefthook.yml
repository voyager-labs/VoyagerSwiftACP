# Lefthook configuration for voyager-app
# Install: lefthook install

post-checkout:
  parallel: false
  commands:
    worktree-setup:
      run: |
        set -eu
        if [ "{1}" = "0000000000000000000000000000000000000000" ]; then
          bash scripts/setup.sh
        else
          mise trust -y "$PWD/mise.toml"
          git submodule update --init --recursive
          mise run docs-setup
        fi

post-merge:
  commands:
    submodules:
      run: |
        set -eu
        mise trust -y "$PWD/mise.toml"
        git submodule update --init --recursive
        mise run docs-setup

pre-commit:
  parallel: false
  commands:
    agent-artifacts-guard:
      run: |
        set -eu
        python3 -c 'import subprocess,sys; paths=subprocess.check_output(["git","diff","--cached","--name-only","-z","--diff-filter=ACMR"]).split(b"\0"); bad=[p for p in paths if p.startswith((b".omo/",b".omx/",b".sisyphus/",b".codegraph/"))]; print("ERROR: local agent artifacts are staged", file=sys.stderr) if bad else None; sys.exit(bool(bad))'
    agent-harness:
      run: |
        set -eu
        # validate_harness runs build-matrix once in its own index snapshot.
        python3 -m scripts.validate_harness --staged
        python3 -m scripts.verify_plan --staged
    swift-checks:
      # No glob: a policy/config-only change must expand the relevant engine scope.
      run: python3 -m scripts.run_swift_checks --staged
