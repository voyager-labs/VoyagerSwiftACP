# Lefthook configuration for voyager-app
# Install: lefthook install

post-checkout:
  parallel: false
  commands:
    mise-trust:
      run: mise trust --all -y
    lefthook-install:
      run: test -f "$(git rev-parse --git-path hooks/post-checkout)" || lefthook install
    submodules:
      run: git submodule update --init --recursive
    docs-canonical-npm-ci:
      run: |
        if [ "{1}" = "0000000000000000000000000000000000000000" ]; then
          if [ -f docs/canonical/package-lock.json ] && [ ! -d docs/canonical/node_modules ]; then
            echo ":: docs/canonical node_modules missing — running npm ci..."
            cd docs/canonical && npm ci
          fi
          exit 0
        fi
        if git diff --name-only {1} {2} -- docs/canonical/package.json docs/canonical/package-lock.json | grep -q .; then
          echo ":: docs/canonical package manifest changed — running npm ci..."
          cd docs/canonical && npm ci
        fi
    codegraph:
      run: test -d .codegraph || (mise trust --all -y && mise exec -- codegraph init -i)
    cupertino:
      run: command -v cupertino >/dev/null 2>&1 || mise install cupertino

post-merge:
  commands:
    submodules:
      run: git submodule update --init --recursive

pre-commit:
  parallel: false
  commands:
    sisyphus-artifacts-guard:
      run: |
        staged=$(git diff --cached --name-only)
        if echo "$staged" | grep -qE '^(\.sisyphus|\.omx)/'; then
          echo "ERROR: .sisyphus/ or .omx/ paths are staged for commit. These are local-only agent harness artifacts." >&2
          echo "Run: git reset HEAD -- .sisyphus/ .omx/" >&2
          exit 1
        fi
    agent-harness:
      run: |
        python3 -m scripts.validate_harness --staged
        python3 -m scripts.verify_plan --staged
    ast-grep:
      glob: "apps/macos/**/*.swift"
      run: |
        swift_files=""
        ui_files=""
        for f in {staged_files}; do
          case "$f" in
            *Tests*) continue ;;
            */Ui/*) ui_files="$ui_files $f" ;;
            *) swift_files="$swift_files $f" ;;
          esac
        done
        # Model & Reducer rules: non-Ui staged files
        if [ -n "$swift_files" ]; then
          for rule in .ast-grep/rules/model/*.yaml .ast-grep/rules/reducer/*.yaml; do
              mise exec "github:ast-grep/ast-grep" -- ast-grep scan --rule "$rule" $swift_files 2>&1
          done
        fi
        # Ui rules: only Ui/ staged files
        if [ -n "$ui_files" ]; then
          for rule in .ast-grep/rules/ui/*.yaml; do
              mise exec "github:ast-grep/ast-grep" -- ast-grep scan --rule "$rule" $ui_files 2>&1
          done
        fi
    swiftformat:
      glob: "apps/macos/**/*.swift"
      run: mise exec -- swiftformat --config apps/macos/.swiftformat {staged_files}
    swiftlint:
      glob: "apps/macos/**/*.swift"
      exclude: "apps/macos/**/*Tests/**/*.swift"
      run: mise exec -- swiftlint --fix --config apps/macos/.swiftlint.yml {staged_files}
    swiftlint-tests:
      glob: "apps/macos/**/*Tests/**/*.swift"
      run: mise exec -- swiftlint --fix --config apps/macos/.swiftlint-tests.yml {staged_files}
    re-stage:
      run: git add {staged_files}
