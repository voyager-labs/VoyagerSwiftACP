# Lefthook configuration for voyager-app
# Install: lefthook install

post-checkout:
  parallel: false
  commands:
    worktree-setup:
      run: |
        if [ "{1}" = "0000000000000000000000000000000000000000" ]; then
          bash scripts/setup.sh
        else
          mise trust -y "$PWD/mise.toml"
          git submodule update --init --recursive
          mise run docs-setup
        fi

post-merge:
  commands:
    submodules:
      run: |
        git submodule update --init --recursive
        mise run docs-setup

pre-commit:
  parallel: false
  commands:
    agent-artifacts-guard:
      run: |
        staged=$(git diff --cached --name-only --diff-filter=ACMR)
        if echo "$staged" | grep -qE '^(\.omo|\.omx|\.sisyphus|\.codegraph)/'; then
          echo "ERROR: Local agent runtime paths are staged for commit." >&2
          echo "Run: git reset HEAD -- .omo/ .omx/ .sisyphus/ .codegraph/" >&2
          exit 1
        fi
    validate-build-matrix:
      run: python3 -m scripts.validate_build_matrix
    agent-harness:
      run: |
        python3 -m scripts.validate_harness --staged
        python3 -m scripts.verify_plan --staged
    ast-grep:
      glob: "apps/macos/**/*.swift"
      run: |
        swift_files=""
        ui_files=""
        for f in {staged_files}; do
          case "$f" in
            *Tests*) continue ;;
            */Ui/*) ui_files="$ui_files $f" ;;
            *) swift_files="$swift_files $f" ;;
          esac
        done
        # Model & Reducer rules: non-Ui staged files
        if [ -n "$swift_files" ]; then
          for rule in .ast-grep/rules/model/*.yaml .ast-grep/rules/reducer/*.yaml; do
              mise exec "github:ast-grep/ast-grep" -- ast-grep scan --rule "$rule" $swift_files 2>&1
          done
        fi
        # Ui rules: only Ui/ staged files
        if [ -n "$ui_files" ]; then
          for rule in .ast-grep/rules/ui/*.yaml; do
              mise exec "github:ast-grep/ast-grep" -- ast-grep scan --rule "$rule" $ui_files 2>&1
          done
        fi
    swiftformat:
      glob: "apps/macos/**/*.swift"
      run: mise exec -- swiftformat --lint --config apps/macos/.swiftformat {staged_files}
    swiftlint:
      glob: "apps/macos/**/*.swift"
      exclude: "apps/macos/**/*Tests/**/*.swift"
      run: mise exec -- swiftlint --config apps/macos/.swiftlint.yml {staged_files}
    swiftlint-tests:
      glob: "apps/macos/**/*Tests/**/*.swift"
      run: mise exec -- swiftlint --config apps/macos/.swiftlint-tests.yml {staged_files}
