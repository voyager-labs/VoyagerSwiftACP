# Lefthook configuration for voyager-app
# Install: lefthook install

post-checkout:
  commands:
    submodules:
      run: git submodule update --init --recursive

post-merge:
  commands:
    submodules:
      run: git submodule update --init --recursive

pre-commit:
  parallel: true
  commands:
    swiftformat:
      glob: "apps/macos/**/*.swift"
      run: swiftformat --config apps/macos/.swiftformat --lint {staged_files}
    swiftlint:
      glob: "apps/macos/**/*.swift"
      exclude: "apps/macos/**/*Tests/**/*.swift"
      run: swiftlint lint --config apps/macos/.swiftlint.yml --strict {staged_files}
    swiftlint-tests:
      glob: "apps/macos/**/*Tests/**/*.swift"
      run: swiftlint lint --config apps/macos/.swiftlint-tests.yml --strict {staged_files}
