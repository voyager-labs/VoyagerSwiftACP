# Lefthook configuration for voyager-app
# Install: lefthook install

post-checkout:
  commands:
    submodules:
      run: git submodule update --init --recursive

post-merge:
  commands:
    submodules:
      run: git submodule update --init --recursive

pre-commit:
  parallel: true
  commands:
    swiftformat:
      glob: "*.swift"
      run: swiftformat --lint {staged_files}
    swiftlint:
      glob: "*.swift"
      run: swiftlint lint --strict {staged_files}
