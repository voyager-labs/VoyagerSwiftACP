name: release-macos-prod

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-macos-prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-identity:
    name: Prepare release identity
    runs-on: ubuntu-latest
    outputs:
      released_at: ${{ steps.identity.outputs.released_at }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Capture immutable release timestamp
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          VOYAGER_RELEASED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            bash ./scripts/ci/prepare-release-identity.sh "${RUNNER_TEMP}/release-identity.env"
          # shellcheck source=/dev/null
          source "${RUNNER_TEMP}/release-identity.env"
          echo "released_at=${VOYAGER_RELEASED_AT}" >> "${GITHUB_OUTPUT}"

  fetch-sparkle-baseline:
    name: Fetch Sparkle baseline (prod)
    runs-on: ubuntu-latest
    environment: production
    outputs:
      has_baseline: ${{ steps.baseline-meta.outputs.has_baseline }}

    env:
      R2_BUCKET: ${{ vars.R2_DOWNLOADS_BUCKET }}
      SPARKLE_APPCAST_KEY: releases/appcast.xml
      BUILD_DIR: ${{ github.workspace }}/build/ci

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare Sparkle baseline directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${BUILD_DIR}"

      - name: Fetch Sparkle appcast from R2
        uses: cloudflare/wrangler-action@v4
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "3.90.0"
          command: |
            r2 object get ${{ env.R2_BUCKET }}/${{ env.SPARKLE_APPCAST_KEY }} --file ${{ env.BUILD_DIR }}/appcast.xml

      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/ci/resolve-version-from-tag.sh

      - name: Resolve Sparkle baseline metadata
        id: baseline-meta
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/ci/resolve-sparkle-baseline.sh "${BUILD_DIR}/appcast.xml" "${{ steps.version.outputs.version }}"

      - name: Prepare baseline zip directory
        if: ${{ steps.baseline-meta.outputs.prev_key != '' && steps.baseline-meta.outputs.prev_name != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${BUILD_DIR}/baseline"

      - name: Fetch previous Sparkle update from R2
        if: ${{ steps.baseline-meta.outputs.prev_key != '' && steps.baseline-meta.outputs.prev_name != '' }}
        uses: cloudflare/wrangler-action@v4
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "3.90.0"
          command: |
            r2 object get ${{ env.R2_BUCKET }}/${{ steps.baseline-meta.outputs.prev_key }} --file ${{ env.BUILD_DIR }}/baseline/${{ steps.baseline-meta.outputs.prev_name }}

      - name: Upload Sparkle baseline artifacts
        if: ${{ steps.baseline-meta.outputs.has_baseline == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: sparkle-baseline
          retention-days: 1
          if-no-files-found: warn
          path: |
            build/ci/appcast.xml
            build/ci/baseline/*.zip

  build-notarize:
    name: Build, notarize (prod)
    needs: [fetch-sparkle-baseline, release-identity]
    runs-on: ${{ fromJSON(vars.RELEASE_MACOS_RUNS_ON || '["self-hosted","macOS","ARM64"]') }}
    environment: production
    outputs:
      version: ${{ steps.version.outputs.version }}

    env:
      PROJECT_PATH: apps/macos/Voyager/Voyager.xcodeproj
      SCHEME: Voyager-Prod
      CONFIGURATION: Release
      BUILD_DIR: ${{ github.workspace }}/build/ci
      CURRENT_PROJECT_VERSION_OVERRIDE: ${{ github.run_number }}
      SIGNING_KEYCHAIN: signing_temp_${{ github.run_id }}_${{ github.run_attempt }}

      RELEASES_PREFIX: releases
      VERSION_PREFIX: releases/versions
      SPARKLE_APPCAST_KEY: releases/appcast.xml
      DOWNLOADS_BASE_URL: ${{ vars.DOWNLOADS_BASE_URL }}
      SPARKLE_BASELINE_COUNT: 2
      VOYAGER_RELEASED_AT: ${{ needs.release-identity.outputs.released_at }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install mise tools
        uses: jdx/mise-action@v4

      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/ci/resolve-version-from-tag.sh

      - name: Import macOS signing certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          keychain: ${{ env.SIGNING_KEYCHAIN }}
          keychain-password: ${{ github.run_id }}-${{ github.run_attempt }}

      - name: Download Sparkle baseline artifacts
        if: ${{ needs.fetch-sparkle-baseline.outputs.has_baseline == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: sparkle-baseline
          path: .

      - name: Build, notarize, package release payload
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
        run: |
          set -euo pipefail
          ./scripts/ci/release-macos-prod.sh build-notarize

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: prod-release
          retention-days: 1
          if-no-files-found: error
          path: |
            ${{ env.BUILD_DIR }}/Voyager.dmg
            ${{ env.BUILD_DIR }}/Voyager-${{ steps.version.outputs.version }}.zip
            ${{ env.BUILD_DIR }}/appcast.xml
            ${{ env.BUILD_DIR }}/release-manifest-v1.json

  upload-release:
    name: Upload release artifacts (prod)
    needs: [build-notarize, release-identity]
    runs-on: ubuntu-latest
    environment: production

    env:
      R2_BUCKET: ${{ vars.R2_DOWNLOADS_BUCKET }}
      RELEASES_PREFIX: releases
      VERSION_PREFIX: releases/versions
      SPARKLE_APPCAST_KEY: releases/appcast.xml
      VERSION: ${{ needs.build-notarize.outputs.version }}
      BUILD_DIR: ${{ github.workspace }}/build/ci
      VOYAGER_RELEASED_AT: ${{ needs.release-identity.outputs.released_at }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: prod-release
          path: ${{ env.BUILD_DIR }}

      - name: Generate latest.json
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/ci/release-macos-prod.sh generate-latest

      - name: Upload to R2 (version + latest)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "3.90.0"
          command: |
            r2 object put ${{ env.R2_BUCKET }}/${{ env.VERSION_PREFIX }}/${{ env.VERSION }}/Voyager.dmg --file ${{ env.BUILD_DIR }}/Voyager.dmg
            r2 object put ${{ env.R2_BUCKET }}/${{ env.RELEASES_PREFIX }}/Voyager.dmg --file ${{ env.BUILD_DIR }}/Voyager.dmg
            r2 object put ${{ env.R2_BUCKET }}/${{ env.RELEASES_PREFIX }}/latest.json --file ${{ env.BUILD_DIR }}/latest.json
            r2 object put ${{ env.R2_BUCKET }}/${{ env.VERSION_PREFIX }}/${{ env.VERSION }}/release-manifest-v1.json --file ${{ env.BUILD_DIR }}/release-manifest-v1.json
            r2 object put ${{ env.R2_BUCKET }}/${{ env.VERSION_PREFIX }}/${{ env.VERSION }}/Voyager-${{ env.VERSION }}.zip --file ${{ env.BUILD_DIR }}/Voyager-${{ env.VERSION }}.zip
            r2 object put ${{ env.R2_BUCKET }}/${{ env.SPARKLE_APPCAST_KEY }} --file ${{ env.BUILD_DIR }}/appcast.xml
