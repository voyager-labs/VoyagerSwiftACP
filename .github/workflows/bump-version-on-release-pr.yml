name: bump-version-on-release-pr

on:
  pull_request:
    types: [opened]
    branches:
      - "main"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bump-version-on-release-pr-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  bump-marketing-version:
    name: Bump MARKETING_VERSION on release branch
    runs-on: ubuntu-latest
    if: startsWith(github.event.pull_request.head.ref, 'release/v')

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Derive version from branch name
        id: version
        shell: bash
        run: |
          set -euo pipefail

          branch="${{ github.event.pull_request.head.ref }}"
          version="${branch#release/}"

          if [[ "${version}" == "${branch}" ]]; then
            echo "::notice::Not a release branch, skipping version bump: ${branch}"
            echo "version=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Require 'v' prefix with optional prerelease suffix (e.g., release/v1.2.3 or release/v1.2.3-rc.1)
          if [[ ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version in release branch name: ${branch}. Expected release/vX.Y.Z or release/vX.Y.Z-<prerelease> (e.g., release/v1.2.3-rc.1)" >&2
            exit 1
          fi

          # Remove 'v' prefix
          version="${version#v}"

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "::notice::Extracted version: ${version} from branch: ${branch}"

      - name: Update MARKETING_VERSION in Xcode project
        if: steps.version.outputs.version != ''
        id: update-xcode
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          pbxproj="apps/macos/Voyager/Voyager.xcodeproj/project.pbxproj"
          if [[ ! -f "${pbxproj}" ]]; then
            echo "::error::Xcode project file not found: ${pbxproj}" >&2
            exit 1
          fi

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          path = Path("apps/macos/Voyager/Voyager.xcodeproj/project.pbxproj")

          data = path.read_text(encoding="utf-8")
          updated = re.sub(r"MARKETING_VERSION = [^;]+;", f"MARKETING_VERSION = {version};", data)

          if updated == data:
              raise SystemExit("No MARKETING_VERSION entries updated (unexpected).")

          path.write_text(updated, encoding="utf-8")
          print(f"Updated MARKETING_VERSION -> {version} in {path}")
          PY

          echo "::notice::Updated MARKETING_VERSION to ${VERSION} in Xcode project"

      - name: Update backend package version (pyproject.toml)
        if: steps.version.outputs.version != ''
        id: update-backend
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          pyproject="apps/backend/pyproject.toml"
          if [[ ! -f "${pyproject}" ]]; then
            echo "::error::pyproject.toml not found: ${pyproject}" >&2
            exit 1
          fi

          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          path = Path("apps/backend/pyproject.toml")

          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          out = []
          in_project = False
          updated = False

          for line in lines:
              stripped = line.strip()
              if stripped == "[project]":
                  in_project = True
                  out.append(line)
                  continue
              if in_project and stripped.startswith("[") and stripped.endswith("]") and stripped != "[project]":
                  in_project = False
              if in_project and stripped.startswith("version ="):
                  out.append(f'version = "{version}"\n')
                  updated = True
              else:
                  out.append(line)

          if not updated:
              raise SystemExit("Failed to update [project].version in apps/backend/pyproject.toml")

          path.write_text("".join(out), encoding="utf-8")
          print(f'Updated backend version -> {version} in {path}')
          PY

          echo "::notice::Updated backend package version to ${VERSION} in pyproject.toml"

      - name: Commit & push (if changed)
        if: steps.version.outputs.version != ''
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "::notice::No changes to commit (versions already match)."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            apps/backend/pyproject.toml \
            apps/macos/Voyager/Voyager.xcodeproj/project.pbxproj
          git commit -m "chore(release): set version to ${VERSION}"
          git push origin HEAD

          echo "::notice::Committed and pushed version update to ${VERSION}"
