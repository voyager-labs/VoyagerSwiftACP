name: validate-storybook

on:
  pull_request:
    paths:
      - "apps/storybook/**"
      - ".github/workflows/validate-storybook.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-storybook-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Validate Storybook quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/storybook

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/storybook/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check source
        run: pnpm check

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Verify illustration contract
        run: pnpm --filter @voyager-labs/file-manager-illustration verify:contract
