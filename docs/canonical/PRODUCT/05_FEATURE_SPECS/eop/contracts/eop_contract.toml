[contract]
id = "eop.entry"
category = "EOP"
primary_object_key = "entry"
secondary_object_keys = [
  "directory",
  "property",
  "selection",
  "entry_action",
  "execution",
  "history",
]
display_region = "file_manager_window.content_pane.page_container.page_mode_directory"

[policy]
entry_actions_apply_to_current_selection = true
destructive_actions_require_explicit_user_intent = true
clipboard_actions_preserve_source_until_paste = true
undo_redo_scoped_to_recent_entry_action = true
reference_copy_does_not_modify_entries = true

[user_visible_status]
allowed = [
  "open_entry_with_default_app_applied",
  "open_entry_with_selected_app_applied",
  "set_default_app_for_entry_applied",
  "quick_look_entry_applied",
  "create_new_folder_applied",
  "copy_entry_ies_applied",
  "cut_entry_ies_applied",
  "paste_entry_ies_applied",
  "duplicate_entry_ies_applied",
  "move_entry_ies_applied",
  "create_entry_alias_applied",
  "compress_entry_ies_applied",
  "extract_compressed_file_s_applied",
  "move_entry_ies_to_trash_applied",
  "delete_entry_ies_immediately_applied",
  "put_deleted_entry_ies_back_applied",
  "empty_trash_applied",
  "undo_entry_action_applied",
  "redo_entry_action_applied",
  "rename_entry_applied",
  "edit_entry_ies_tags_applied",
  "get_entry_info_applied",
  "change_entry_permission_s_applied",
  "batch_rename_entries_applied",
  "copy_absolute_path_s_of_entry_ies_applied",
  "copy_releative_path_s_of_entry_ies_applied",
  "copy_urls_of_entry_ies_applied",
]
forbidden = []

[status.open_entry_with_default_app_applied]
description = "Open Entry with Default App 결과가 사용자에게 반영된 상태"
entered_by = ["EOP-001-open_entry_with_default_app"]
exits_to = []
terminal = true
user_visible = true

