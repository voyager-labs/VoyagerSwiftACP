[contract]
id = "cbw.request_lifecycle"
category = "CBW"
primary_object_key = "request"
secondary_object_keys = ["turn", "response"]
display_region = "file_manager_window.inspector_pane.inspector_mode_chat.message_area"

[vocabulary]
submit = "draft 입력을 실행용 request로 확정하고 새 `request`와 새 `turn`을 시작하는 action"
regenerate = "기존 `request`를 다시 실행해 같은 `turn` 안에 새 `response`를 만드는 action"
cancel = "현재 `processing` 상태인 `request`의 최신 `response` 생성을 중단하는 action"
downstream_turn = "특정 기준 `request` 뒤에 이어지는 후속 `turn`"
request_preparation = "현재 request를 외부 AI 실행에 넘기기 위해 `context_snapshot`, `request_message`, `turn_history`가 연결된 `chat_session`, `active_model`, `active_provider`를 결합하는 단계"

[policy]
user_visible_state_owner = "request"
single_processing_response_per_request = true
submit_creates_new_request = true
submit_creates_new_turn = true
regenerate_reuses_existing_request = true
regenerate_reuses_existing_request_note = "새 `request`를 만들지 않고 재생성 대상 `request` identity를 유지한다"
regenerate_reuses_existing_turn = true
regenerate_reuses_existing_turn_note = "새 `turn`을 만들지 않고 재생성 대상 `request`가 속한 기존 `turn` 안에서 새 `response`만 다시 만든다"
regenerate_creates_new_response = true
regenerate_allowed_from = ["completed", "failed"]
regenerate_forbidden_from = ["processing", "cancelled"]
cancel_allowed_from = ["processing"]
cancel_forbidden_from = ["completed", "failed", "cancelled"]

[user_visible_states]
allowed = ["processing", "completed", "failed", "cancelled"]
forbidden = ["queued", "cancelling"]

[state.processing]
description = "요청이 현재 응답 생성 중인 상태"
entered_by = ["CBW-001-submit_chat_request", "CBW-001-regenerate_chat_response"]
exits_to = ["completed", "failed", "cancelled"]
terminal = false
user_visible = true

[state.completed]
description = "최신 response가 정상 완료된 상태"
entered_by = ["CBW-003-stream_contextual_chat_response"]
exits_to = ["processing"]
terminal = true
user_visible = true

[state.failed]
description = "최신 response가 실패로 종료된 상태"
entered_by = ["CBW-003-show_request_resolution_failure"]
exits_to = ["processing"]
terminal = true
user_visible = true

[state.cancelled]
description = "사용자 취소로 최신 response 생성이 중단된 상태"
entered_by = ["CBW-001-cancel_active_chat_request"]
exits_to = []
terminal = true
user_visible = true

[ownership."CBW-001-submit_chat_request"]
reads = []
writes = ["processing"]
creates_objects = ["request", "turn", "response"]
display_region = "file_manager_window.inspector_pane.inspector_mode_chat.chat_field"

[ownership."CBW-001-show_request_processing_state"]
reads = ["processing", "completed", "failed", "cancelled"]
writes = []
display_region = "file_manager_window.inspector_pane.inspector_mode_chat.message_area"

[ownership."CBW-001-cancel_active_chat_request"]
reads = ["processing"]
writes = ["cancelled"]
target_object = "request"
control_region = "file_manager_window.inspector_pane.inspector_mode_chat.chat_field"

[ownership."CBW-001-regenerate_chat_response"]
reads = ["completed", "failed"]
writes = ["processing"]
creates_objects = ["response"]
preserves_objects = ["request", "turn"]
control_region = "file_manager_window.inspector_pane.inspector_mode_chat.message_area"

[ownership."CBW-003-prepare_contextual_chat_request"]
reads = ["processing"]
writes = []

[ownership."CBW-003-generate_contextual_chat_response"]
reads = ["processing"]
writes = []
target_object = "response"

[ownership."CBW-003-stream_contextual_chat_response"]
reads = ["processing"]
writes = ["completed"]
target_object = "response"

[ownership."CBW-003-show_request_resolution_failure"]
reads = ["failed"]
writes = ["failed"]
display_region = "file_manager_window.inspector_pane.inspector_mode_chat.message_area"

[transitions.processing_to_completed]
from = "processing"
to = "completed"
trigger = "CBW-003-stream_contextual_chat_response"

[transitions.processing_to_failed]
from = "processing"
to = "failed"
trigger = "CBW-003-show_request_resolution_failure"

[transitions.processing_to_cancelled]
from = "processing"
to = "cancelled"
trigger = "CBW-001-cancel_active_chat_request"

[transitions.completed_to_processing]
from = "completed"
to = "processing"
trigger = "CBW-001-regenerate_chat_response"

[transitions.failed_to_processing]
from = "failed"
to = "processing"
trigger = "CBW-001-regenerate_chat_response"
