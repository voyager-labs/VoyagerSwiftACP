[contract]
id = "cbw.provider_selection"
category = "CBW"
primary_object_key = "active_provider"
secondary_object_keys = ["provider_catalog"]
display_region = "file_manager_window.inspector_pane.inspector_mode_chat.chat_menu_area"

[policy]
provider_change_applies_from_next_request = true
same_provider_selection_is_noop = true
provider_change_recomputes_model_availability = true
provider_selector_may_open_during_processing = true
connection_required_blocks_provider_activation = true

[user_visible_status]
allowed = [
    "provider_selector_open",
    "provider_catalog_loading",
    "provider_selected",
    "provider_selection_required",
    "provider_unavailable",
]

[status.provider_selector_open]
description = "provider selector가 열려 현재 대화의 provider 후보를 탐색 중인 상태"
entered_by = ["CBW-004-open_chat_provider_selector"]
terms = ["provider selector", "selector가 열", "provider 전환 UI"]

[status.provider_catalog_loading]
description = "provider 후보 목록 또는 연결 상태를 아직 로딩 중인 상태"
entered_by = ["CBW-004-open_chat_provider_selector"]
terms = ["loading state", "연결 상태 조회", "목록 조회", "loading"]

[status.provider_selected]
description = "현재 대화에 다음 request부터 적용될 active provider가 확정된 상태"
entered_by = ["CBW-004-select_active_chat_provider"]
terms = ["active provider", "현재 대화의 active provider", "provider"]

[status.provider_selection_required]
description = "현재 대화에 적용할 provider를 아직 확정하지 못해 선택이 필요한 상태"
entered_by = ["CBW-004-show_active_chat_provider_and_model"]
terms = ["선택 필요", "provider 선택", "active provider"]

[status.provider_unavailable]
description = "연결 필요 또는 정책상 제한으로 provider를 현재 대화에 적용할 수 없는 상태"
entered_by = [
    "CBW-004-show_active_chat_provider_and_model",
    "CBW-004-show_available_chat_providers",
]
terms = ["connection required", "연결 필요", "전환 불가", "비활성", "unavailable"]

[ownership."CBW-004-show_active_chat_provider_and_model"]
reads = [
    "provider_selected",
    "provider_selection_required",
    "provider_unavailable",
]
writes = ["provider_selection_required", "provider_unavailable"]
target_object = "active_provider"
display_region = "file_manager_window.inspector_pane.inspector_mode_chat.chat_menu_area"

[ownership."CBW-004-open_chat_provider_selector"]
reads = ["provider_selected", "provider_unavailable"]
writes = ["provider_selector_open", "provider_catalog_loading"]
target_object = "provider_catalog"
control_region = "file_manager_window.inspector_pane.inspector_mode_chat.chat_menu_area"

[ownership."CBW-004-show_available_chat_providers"]
reads = [
    "provider_selector_open",
    "provider_catalog_loading",
    "provider_selected",
    "provider_unavailable",
]
writes = ["provider_unavailable"]
target_object = "provider_catalog"
display_region = "file_manager_window.inspector_pane.inspector_mode_chat.chat_menu_area"

[ownership."CBW-004-select_active_chat_provider"]
reads = ["provider_selector_open", "provider_unavailable"]
writes = ["provider_selected"]
target_object = "active_provider"
control_region = "file_manager_window.inspector_pane.inspector_mode_chat.chat_menu_area"

[ownership."CBW-003-build_contextual_request_payload"]
reads = ["provider_selected"]
writes = []
target_object = "active_provider"
