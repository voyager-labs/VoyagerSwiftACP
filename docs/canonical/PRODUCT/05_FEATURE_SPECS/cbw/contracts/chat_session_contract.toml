[contract]
id = "cbw.chat_session"
category = "CBW"
primary_object_key = "chat_session"
secondary_object_keys = ["turn", "request", "response"]
scope_region = "file_manager_window.inspector_pane.inspector_mode_chat"

[policy]
regenerate_strategy = "single_timeline_rewrite"
regenerate_strategy_note = "regenerate는 branch session을 만들지 않고, 기준 request 뒤에 이어지는 후속 turn을 active session에서 제외하는 방식만 허용한다"
single_active_session_per_chat_surface = true
restore_failure_fallback = "new_session"

[user_visible_status]
allowed = ["new_session", "restored_session", "restore_failed", "rebind_required"]

[status.new_session]
description = "복원 가능한 기존 session 없이 새 대화를 시작한 상태"
entered_by = ["CBW-005-start_chat_conversation_session"]
allows_submit = true

[status.restored_session]
description = "기존 대화 기록을 복원해 이어가는 상태"
entered_by = ["CBW-005-restore_chat_conversation_session"]
allows_submit = true

[status.restore_failed]
description = "기존 session 복원 시도가 실패한 상태"
entered_by = ["CBW-005-restore_chat_conversation_session"]
allows_submit = false
fallback_status = "new_session"

[status.rebind_required]
description = "기존 session 기록은 복원되지만 현재 맥락 기준으로 다시 연결이 필요한 상태"
entered_by = ["CBW-005-restore_chat_conversation_session"]
allows_submit = false
requires_followup = ["CBW-002-show_request_context"]

[ownership."CBW-001-open_contextual_chat"]
reads = ["new_session", "restored_session"]
writes = []
display_region = "file_manager_window.inspector_pane.inspector_mode_chat"

[ownership."CBW-005-start_chat_conversation_session"]
reads = []
writes = ["new_session"]
creates_objects = ["chat_session"]

[ownership."CBW-005-continue_chat_conversation_session"]
reads = ["new_session", "restored_session"]
writes = []
target_object = "chat_session"

[ownership."CBW-005-restore_chat_conversation_session"]
reads = []
writes = ["restored_session", "restore_failed", "rebind_required"]
target_object = "chat_session"
