[contract]
id = "cbw.request_context"
category = "CBW"
primary_object_key = "request_context"
secondary_object_keys = [
  "context_entry",
  "context_snapshot",
  "selection",
  "attachment",
]
display_region = "file_manager_window.inspector_pane.inspector_mode_chat.chat_field"

[vocabulary]
current_context = "현재 page와 현재 selection을 Chat Field 안의 고정된 위치에서 보여주는 system-prepared request context 그룹"
added_attachments = "Chat Field request context 영역에서 chip 또는 summary로 보여주는 explicit attachment 그룹으로, picker 등 non-inline 경로로 추가한 attachment를 모아 보여주는 그룹"

[policy]
snapshot_capture_trigger = "submit_or_regenerate"
snapshot_is_request_scoped = true
draft_context_mutable_before_snapshot = true
locked_snapshot_blocks_in_place_edit = true
empty_context_allowed = true
broken_reference_display_required = true
truncation_records_exclusion_metadata = true
current_context_seeded_on_chat_entry = true
current_context_display_fixed = true
current_context_uses_attachment_affordance = false
selection_update_reuses_current_context_slot = true
explicit_attachment_display_separate = true
inline_attachment_registers_in_request_context = true
inline_attachment_visible_in_message_only = true
inline_attachment_not_duplicated_in_added_attachments = true
selection_visible_as_single_current_context_chip = true

[user_visible_status]
allowed = [
  "draft_context",
  "empty_context",
  "broken_reference",
  "request_context_locked",
]

[status.draft_context]
description = "현재 request에 반영될 current context(page·selection)와 명시적으로 추가한 attachment 구성이 편집 가능한 상태"
entered_by = [
  "CBW-001-open_contextual_chat",
  "CBW-002-add_attachment_from_picker",
  "CBW-002-add_selection_to_context",
  "CBW-002-add_inline_attachment",
  "CBW-002-remove_request_context",
]
allows_submit = true

[status.empty_context]
description = "현재 request에 포함된 current context entry와 명시적으로 추가한 attachment가 모두 없는 상태"
entered_by = [
  "CBW-001-open_contextual_chat",
  "CBW-002-remove_request_context",
  "CBW-002-show_request_context",
]
allows_submit = true

[status.broken_reference]
description = "draft context 안에 삭제되었거나 접근 불가한 attachment 또는 기타 explicit entry가 포함된 상태"
entered_by = ["CBW-002-show_request_context"]
allows_submit = true

[status.request_context_locked]
description = "제출 시점의 current context(page·selection)와 명시적으로 추가한 attachment 구성이 immutable context snapshot으로 고정된 상태"
entered_by = ["CBW-002-capture_request_context_snapshot"]
allows_submit = true

[ownership."CBW-001-open_contextual_chat"]
reads = []
writes = ["draft_context", "empty_context"]
target_object = "request_context"
control_region = "file_manager_window.inspector_pane.inspector_mode_chat"

[ownership."CBW-002-show_request_context"]
reads = [
  "draft_context",
  "empty_context",
  "broken_reference",
  "request_context_locked",
]
writes = ["empty_context", "broken_reference"]
display_region = "file_manager_window.inspector_pane.inspector_mode_chat.chat_field"

[ownership."CBW-002-add_attachment_from_picker"]
reads = ["draft_context"]
writes = ["draft_context"]
target_object = "attachment"
control_region = "file_manager_window.inspector_pane.inspector_mode_chat.chat_field"

[ownership."CBW-002-add_selection_to_context"]
reads = ["draft_context"]
writes = ["draft_context"]
target_object = "selection"
control_region = "file_manager_window.content_pane.page_container"

[ownership."CBW-002-add_inline_attachment"]
reads = ["draft_context"]
writes = ["draft_context"]
target_object = "attachment"
control_region = "file_manager_window.inspector_pane.inspector_mode_chat.chat_field"

[ownership."CBW-002-remove_request_context"]
reads = ["draft_context", "request_context_locked"]
writes = ["draft_context", "empty_context"]
target_object = "attachment"
control_region = "file_manager_window.inspector_pane.inspector_mode_chat.chat_field"

[ownership."CBW-002-capture_request_context_snapshot"]
reads = ["draft_context", "broken_reference"]
writes = ["request_context_locked"]
target_object = "context_snapshot"

[ownership."CBW-003-prepare_contextual_chat_request"]
reads = ["request_context_locked"]
writes = []
target_object = "context_snapshot"

[transitions.draft_context_to_request_context_locked]
from = "draft_context"
to = "request_context_locked"
trigger = "CBW-002-capture_request_context_snapshot"

[transitions.broken_reference_to_request_context_locked]
from = "broken_reference"
to = "request_context_locked"
trigger = "CBW-002-capture_request_context_snapshot"
