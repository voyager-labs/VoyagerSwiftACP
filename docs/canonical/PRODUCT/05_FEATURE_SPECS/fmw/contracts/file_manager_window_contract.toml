[contract]
id = "fmw.file_manager_window"
category = "FMW"
primary_object_key = "command"
secondary_object_keys = ["action"]
display_region = "file_manager_window"

[policy]
window_commands_apply_to_active_window = true
open_window_creates_new_workspace_session = true
close_window_preserves_other_windows = true
quit_terminates_all_windows = true
pane_width_clamped_to_allowed_range = true
hidden_sidebar_drawer_is_transient = true
sidebar_and_inspector_visibility_are_independent = true

[user_visible_status]
allowed = [
  "app_terminating",
  "window_open",
  "window_closing",
  "window_closed",
  "full_screen",
  "windowed",
  "minimized",
  "pinned",
  "unpinned",
  "window_resized",
  "sidebar_visible",
  "sidebar_hidden",
  "sidebar_transient",
  "sidebar_resized",
  "inspector_visible",
  "inspector_hidden",
  "inspector_resized",
]
forbidden = ["opening", "closing_pending", "pane_collapsed"]

[status.app_terminating]
description = "사용자가 Voyager 종료를 확정해 모든 File Manager Window가 닫히는 중인 상태"
entered_by = ["FMW-001-quit_voyager"]
exits_to = []
terminal = true
user_visible = true

[status.window_open]
description = "File Manager Window가 생성되어 활성 창으로 사용할 수 있는 상태"
entered_by = ["FMW-001-open_new_file_manager_window"]
exits_to = []
terminal = true
user_visible = true

[status.window_closing]
description = "활성 File Manager Window가 닫기 요청을 처리하는 상태"
entered_by = ["FMW-001-close_file_manager_window"]
exits_to = []
terminal = true
user_visible = true

[status.window_closed]
description = "대상 File Manager Window가 닫혀 더 이상 사용자 작업 대상이 아닌 상태"
entered_by = ["FMW-001-close_file_manager_window"]
exits_to = []
terminal = true
user_visible = true

[status.full_screen]
description = "File Manager Window가 macOS 전체 화면 공간에서 표시되는 상태"
entered_by = ["FMW-001-enter_full_screen_for_file_manager_window"]
exits_to = []
terminal = true
user_visible = true

[status.windowed]
description = "File Manager Window가 전체 화면을 벗어나 일반 창으로 표시되는 상태"
entered_by = ["FMW-001-exit_full_screen_for_file_manager_window"]
exits_to = []
terminal = true
user_visible = true

[status.minimized]
description = "File Manager Window가 Dock으로 최소화되어 화면에서 숨겨진 상태"
entered_by = ["FMW-001-minimize_file_manager_window"]
exits_to = []
terminal = true
user_visible = true

[status.pinned]
description = "File Manager Window가 다른 앱 창보다 앞에 유지되도록 고정된 상태"
entered_by = ["FMW-001-keep_file_manager_window_on_top"]
exits_to = []
terminal = true
user_visible = true

[status.unpinned]
description = "File Manager Window가 일반 창 z-order 규칙을 따르는 상태"
entered_by = ["FMW-001-keep_file_manager_window_on_top"]
exits_to = []
terminal = true
user_visible = true

[status.window_resized]
description = "File Manager Window 크기가 허용 범위 안에서 조정된 상태"
entered_by = ["FMW-001-adjust_file_manager_window_size"]
exits_to = []
terminal = true
user_visible = true

[status.sidebar_visible]
description = "Sidebar가 File Manager Window 좌측에 고정 표시되는 상태"
entered_by = ["FMW-002-show_sidebar"]
exits_to = []
terminal = true
user_visible = true

[status.sidebar_hidden]
description = "Sidebar가 File Manager Window에서 보이지 않는 상태"
entered_by = ["FMW-002-hide_sidebar"]
exits_to = []
terminal = true
user_visible = true

[status.sidebar_transient]
description = "숨겨진 Sidebar가 임시 drawer로 표시되어 포커스 이탈 시 사라질 수 있는 상태"
entered_by = ["FMW-002-draw_hidden_sidebar"]
exits_to = []
terminal = true
user_visible = true

[status.sidebar_resized]
description = "Sidebar 너비가 허용 범위 안에서 조정된 상태"
entered_by = ["FMW-002-adjust_sidebar_width"]
exits_to = []
terminal = true
user_visible = true

[status.inspector_visible]
description = "Inspector Pane이 File Manager Window 우측에 고정 표시되는 상태"
entered_by = ["FMW-002-show_inspector_pane"]
exits_to = []
terminal = true
user_visible = true

[status.inspector_hidden]
description = "Inspector Pane이 File Manager Window에서 보이지 않는 상태"
entered_by = ["FMW-002-hide_inspector_pane"]
exits_to = []
terminal = true
user_visible = true

[status.inspector_resized]
description = "Inspector Pane 너비가 허용 범위 안에서 조정된 상태"
entered_by = ["FMW-002-adjust_inspector_pane_width"]
exits_to = []
terminal = true
user_visible = true

[ownership."FMW-001-quit_voyager"]
reads = []
writes = ["app_terminating"]
target_object = "command"
control_region = "file_manager_window"

[ownership."FMW-001-open_new_file_manager_window"]
reads = []
writes = ["window_open"]
target_object = "command"
display_region = "file_manager_window"

[ownership."FMW-001-close_file_manager_window"]
reads = ["window_open"]
writes = ["window_closing", "window_closed"]
target_object = "command"
control_region = "file_manager_window"

[ownership."FMW-001-enter_full_screen_for_file_manager_window"]
reads = ["window_open", "windowed"]
writes = ["full_screen"]
target_object = "command"
control_region = "file_manager_window"

[ownership."FMW-001-exit_full_screen_for_file_manager_window"]
reads = ["full_screen"]
writes = ["windowed"]
target_object = "command"
control_region = "file_manager_window"

[ownership."FMW-001-minimize_file_manager_window"]
reads = ["window_open"]
writes = ["minimized"]
target_object = "command"
control_region = "file_manager_window"

[ownership."FMW-001-keep_file_manager_window_on_top"]
reads = ["window_open", "pinned", "unpinned"]
writes = ["pinned", "unpinned"]
target_object = "command"
control_region = "file_manager_window"

[ownership."FMW-001-adjust_file_manager_window_size"]
reads = ["window_open"]
writes = ["window_resized"]
target_object = "command"
control_region = "file_manager_window"

[ownership."FMW-002-show_sidebar"]
reads = ["sidebar_hidden"]
writes = ["sidebar_visible"]
display_region = "file_manager_window.sidebar"

[ownership."FMW-002-hide_sidebar"]
reads = ["sidebar_visible", "sidebar_transient"]
writes = ["sidebar_hidden"]
display_region = "file_manager_window.sidebar"

[ownership."FMW-002-adjust_sidebar_width"]
reads = ["sidebar_visible"]
writes = ["sidebar_resized"]
control_region = "file_manager_window.sidebar"

[ownership."FMW-002-draw_hidden_sidebar"]
reads = ["sidebar_hidden"]
writes = ["sidebar_transient"]
display_region = "file_manager_window.sidebar"

[ownership."FMW-002-show_inspector_pane"]
reads = ["inspector_hidden"]
writes = ["inspector_visible"]
display_region = "file_manager_window.inspector_pane"

[ownership."FMW-002-hide_inspector_pane"]
reads = ["inspector_visible"]
writes = ["inspector_hidden"]
display_region = "file_manager_window.inspector_pane"

[ownership."FMW-002-adjust_inspector_pane_width"]
reads = ["inspector_visible"]
writes = ["inspector_resized"]
control_region = "file_manager_window.inspector_pane"
