[contract]
id = "rcl.collection_scope"
category = "RCL"
primary_object_key = "scope"
secondary_object_keys = ["directory", "collection", "filter"]
display_region = "file_manager_window.content_pane.content_header.collection_filter_composer"

[vocabulary]
scope_candidate = "스코프에 새로 추가할 수 있는 후보 범위 항목"
scope_exception = "기준 범위 아래에서 현재 스코프에서 제외된 하위 범위"
current_scope_summary = "현재 콜렉션 범위를 대표 정보와 보조 정보로 요약한 표시 영역"
root_only_scope = "명시적 범위가 없을 때 현재 페이지/콜렉션 문맥이 기본으로 제공하는 적용 범위"

[policy]
root_only_is_not_empty = true
root_only_uses_context_default_scope = true
explicit_scope_replaces_root_only = true
single_explicit_scope_allowed = true
multi_explicit_scope_allowed = true
exception_valid_if_belongs_to_any_current_scope = true
include_subfolders_on_means_default_include = true
include_subfolders_off_means_root_only_include = true
current_scope_selection_is_adjust = true
candidate_selection_is_add = true
default_candidates_visible_when_query_empty = true
no_results_requires_recovery = true
change_feedback_shows_latest_change_only = true
undo_redo_are_single_step = true
multi_scope_combines_by_union = true
exceptions_apply_after_scope_union = true
exception_only_affects_descendants_of_parent_scope = true
include_subfolders_applies_before_exception_subtraction = true

[user_visible_states]
allowed = [
  "root_only",
  "single_explicit_scope",
  "multi_explicit_scope",
  "exception_present",
  "default_candidates",
  "search_results",
  "no_results",
  "change_feedback_delayed",
  "change_feedback_failed",
  "change_feedback_visible",
  "undo_available",
  "redo_available"
]
forbidden = [
  "empty_scope",
  "candidate_equals_current_scope",
  "exception_as_candidate",
  "partial_undo_stack_browser"
]

[state.root_only]
description = "명시적 범위가 없고 현재 페이지 또는 현재 콜렉션 문맥이 제공하는 기본 적용 범위가 현재 스코프를 정의하는 상태"
entered_by = ["RCL-001-open_collection_filter_composer", "RCL-001-remove_directory_from_collection_scope"]
exits_to = ["single_explicit_scope"]
terminal = false
user_visible = true
terms = ["root-only", "기본 범위 상태"]

[state.change_feedback_delayed]
description = "스코프 변경은 반영되었지만 결과 영역이 아직 최신 상태로 갱신되지 않은 지연 상태"
entered_by = ["RCL-001-show_collection_scope_change_feedback"]
exits_to = ["change_feedback_visible", "change_feedback_failed"]
terminal = false
user_visible = true
terms = ["변경 반영 지연 상태"]

[state.change_feedback_failed]
description = "스코프 변경 후 결과 반영 또는 상태 갱신이 실패해 실패 피드백을 보여주는 상태"
entered_by = ["RCL-001-show_collection_scope_change_feedback"]
exits_to = ["change_feedback_visible"]
terminal = false
user_visible = true
terms = ["변경 반영 실패 상태"]

[state.single_explicit_scope]
description = "하나의 명시적 기준 범위가 현재 스코프를 대표하는 상태"
entered_by = ["RCL-001-add_directory_to_collection_scope"]
exits_to = ["multi_explicit_scope", "root_only", "exception_present", "change_feedback_delayed"]
terminal = false
user_visible = true
terms = ["단일 명시적 스코프"]

[state.multi_explicit_scope]
description = "둘 이상의 명시적 기준 범위가 함께 현재 스코프를 구성하는 상태"
entered_by = ["RCL-001-add_directory_to_collection_scope"]
exits_to = ["single_explicit_scope", "exception_present"]
terminal = false
user_visible = true
terms = ["다중 명시적 스코프"]

[state.exception_present]
description = "하나 이상의 기준 범위 아래에 예외가 존재하는 상태"
entered_by = ["RCL-001-exclude_directory_from_collection_scope"]
exits_to = ["single_explicit_scope", "multi_explicit_scope", "root_only"]
terminal = false
user_visible = true
terms = ["예외 포함 상태"]

[state.default_candidates]
description = "검색어가 비어 있고 기본 후보 목록이 보이는 상태"
entered_by = ["RCL-001-open_collection_scope_menu", "RCL-001-search_collection_scope_candidates"]
exits_to = ["search_results", "no_results"]
terminal = false
user_visible = true
terms = ["기본 후보"]

[state.search_results]
description = "검색어 기준 후보 결과가 보이는 상태"
entered_by = ["RCL-001-search_collection_scope_candidates"]
exits_to = ["default_candidates", "no_results"]
terminal = false
user_visible = true
terms = ["검색 결과"]

[state.no_results]
description = "검색 결과가 없고 검색 수정 또는 기본 후보 복귀가 필요한 상태"
entered_by = ["RCL-001-search_collection_scope_candidates"]
exits_to = ["search_results", "default_candidates"]
terminal = false
user_visible = true
terms = ["결과 없음"]

[state.change_feedback_visible]
description = "최근 스코프 변경 1건에 대한 변경 피드백이 보이는 상태"
entered_by = [
  "RCL-001-add_directory_to_collection_scope",
  "RCL-001-remove_directory_from_collection_scope",
  "RCL-001-exclude_directory_from_collection_scope",
  "RCL-001-restore_directory_to_collection_scope",
  "RCL-001-toggle_collection_scope_subfolder_inclusion"
]
exits_to = ["undo_available"]
terminal = false
user_visible = true
terms = ["변경 피드백"]

[state.undo_available]
description = "최근 변경을 한 단계 되돌릴 수 있는 상태"
entered_by = [
  "RCL-001-add_directory_to_collection_scope",
  "RCL-001-remove_directory_from_collection_scope",
  "RCL-001-exclude_directory_from_collection_scope",
  "RCL-001-restore_directory_to_collection_scope",
  "RCL-001-toggle_collection_scope_subfolder_inclusion"
]
exits_to = ["redo_available"]
terminal = false
user_visible = true
terms = ["되돌리기 가능"]

[state.redo_available]
description = "가장 최근 undo를 한 단계 다시 적용할 수 있는 상태"
entered_by = ["RCL-001-undo_collection_filter_changes"]
exits_to = ["change_feedback_visible"]
terminal = false
user_visible = true
terms = ["다시 적용 가능"]

[ownership."RCL-001-open_collection_filter_composer"]
reads = []
writes = ["root_only"]
target_object = "scope"
display_region = "file_manager_window.content_pane.content_header.collection_filter_composer"

[ownership."RCL-001-open_collection_scope_menu"]
reads = ["root_only", "single_explicit_scope", "multi_explicit_scope", "exception_present", "default_candidates", "search_results", "no_results"]
writes = ["default_candidates", "search_results", "no_results"]
target_object = "scope"
display_region = "file_manager_window.content_pane.content_header.collection_filter_composer"

[ownership."RCL-001-show_collection_scope_summary"]
reads = ["root_only", "single_explicit_scope", "multi_explicit_scope", "exception_present"]
writes = []
target_object = "scope"
display_region = "file_manager_window.content_pane.content_header.collection_filter_composer"

[ownership."RCL-001-search_collection_scope_candidates"]
reads = ["default_candidates", "search_results", "no_results"]
writes = ["search_results", "no_results", "default_candidates"]
target_object = "scope"

[ownership."RCL-001-show_collection_scope_candidate_disambiguation"]
reads = ["search_results"]
writes = []
target_object = "directory"

[ownership."RCL-001-add_directory_to_collection_scope"]
reads = ["root_only", "single_explicit_scope", "multi_explicit_scope", "exception_present"]
writes = ["single_explicit_scope", "multi_explicit_scope", "exception_present", "change_feedback_visible", "undo_available"]
target_object = "scope"

[ownership."RCL-001-remove_directory_from_collection_scope"]
reads = ["single_explicit_scope", "multi_explicit_scope", "exception_present"]
writes = ["single_explicit_scope", "root_only", "exception_present", "change_feedback_visible", "undo_available"]
target_object = "scope"

[ownership."RCL-001-exclude_directory_from_collection_scope"]
reads = ["single_explicit_scope", "multi_explicit_scope"]
writes = ["exception_present", "change_feedback_visible", "undo_available"]
target_object = "scope"

[ownership."RCL-001-restore_directory_to_collection_scope"]
reads = ["exception_present"]
writes = ["single_explicit_scope", "multi_explicit_scope", "change_feedback_visible", "undo_available"]
target_object = "scope"

[ownership."RCL-001-toggle_collection_scope_subfolder_inclusion"]
reads = ["single_explicit_scope", "multi_explicit_scope", "exception_present"]
writes = ["change_feedback_visible", "undo_available"]
target_object = "scope"

[ownership."RCL-001-show_collection_scope_exceptions"]
reads = ["exception_present"]
writes = []
target_object = "scope"

[ownership."RCL-001-show_collection_scope_change_feedback"]
reads = ["change_feedback_visible", "change_feedback_delayed", "change_feedback_failed", "undo_available", "redo_available"]
writes = ["change_feedback_delayed", "change_feedback_failed", "change_feedback_visible", "undo_available"]
target_object = "scope"

[ownership."RCL-001-undo_collection_filter_changes"]
reads = ["undo_available", "change_feedback_visible"]
writes = ["redo_available", "change_feedback_visible"]
target_object = "scope"

[ownership."RCL-001-redo_collection_filter_changes"]
reads = ["redo_available"]
writes = ["change_feedback_visible"]
target_object = "scope"

[transitions.root_only_to_single_explicit_scope]
from = "root_only"
to = "single_explicit_scope"
trigger = "RCL-001-add_directory_to_collection_scope"

[transitions.single_explicit_scope_to_root_only]
from = "single_explicit_scope"
to = "root_only"
trigger = "RCL-001-remove_directory_from_collection_scope"

[transitions.scope_change_to_feedback_delayed]
from = "single_explicit_scope"
to = "change_feedback_delayed"
trigger = "RCL-001-show_collection_scope_change_feedback"

[transitions.feedback_delayed_to_visible]
from = "change_feedback_delayed"
to = "change_feedback_visible"
trigger = "RCL-001-show_collection_scope_change_feedback"

[transitions.feedback_delayed_to_failed]
from = "change_feedback_delayed"
to = "change_feedback_failed"
trigger = "RCL-001-show_collection_scope_change_feedback"

[transitions.feedback_failed_to_visible]
from = "change_feedback_failed"
to = "change_feedback_visible"
trigger = "RCL-001-show_collection_scope_change_feedback"

[transitions.single_to_multi_explicit_scope]
from = "single_explicit_scope"
to = "multi_explicit_scope"
trigger = "RCL-001-add_directory_to_collection_scope"

[transitions.multi_explicit_scope_to_single]
from = "multi_explicit_scope"
to = "single_explicit_scope"
trigger = "RCL-001-remove_directory_from_collection_scope"

[transitions.explicit_scope_to_exception_present]
from = "single_explicit_scope"
to = "exception_present"
trigger = "RCL-001-exclude_directory_from_collection_scope"

[transitions.multi_scope_to_exception_present]
from = "multi_explicit_scope"
to = "exception_present"
trigger = "RCL-001-exclude_directory_from_collection_scope"

[transitions.exception_present_to_scope_only]
from = "exception_present"
to = "single_explicit_scope"
trigger = "RCL-001-restore_directory_to_collection_scope"

[transitions.exception_present_to_multi_scope]
from = "exception_present"
to = "multi_explicit_scope"
trigger = "RCL-001-restore_directory_to_collection_scope"

[transitions.exception_present_to_root_only]
from = "exception_present"
to = "root_only"
trigger = "RCL-001-remove_directory_from_collection_scope"

[transitions.default_candidates_to_search_results]
from = "default_candidates"
to = "search_results"
trigger = "RCL-001-search_collection_scope_candidates"

[transitions.default_candidates_to_no_results]
from = "default_candidates"
to = "no_results"
trigger = "RCL-001-search_collection_scope_candidates"

[transitions.search_results_to_no_results]
from = "search_results"
to = "no_results"
trigger = "RCL-001-search_collection_scope_candidates"

[transitions.search_results_to_default_candidates]
from = "search_results"
to = "default_candidates"
trigger = "RCL-001-search_collection_scope_candidates"

[transitions.no_results_to_search_results]
from = "no_results"
to = "search_results"
trigger = "RCL-001-search_collection_scope_candidates"

[transitions.no_results_to_default_candidates]
from = "no_results"
to = "default_candidates"
trigger = "RCL-001-search_collection_scope_candidates"

[transitions.change_feedback_to_undo_available]
from = "change_feedback_visible"
to = "undo_available"
trigger = "RCL-001-show_collection_scope_change_feedback"

[transitions.undo_available_to_redo_available]
from = "undo_available"
to = "redo_available"
trigger = "RCL-001-undo_collection_filter_changes"

[transitions.redo_available_to_change_feedback]
from = "redo_available"
to = "change_feedback_visible"
trigger = "RCL-001-redo_collection_filter_changes"
