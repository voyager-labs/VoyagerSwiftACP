[contract]
id = "evm.page"
category = "EVM"
primary_object_key = "page"
secondary_object_keys = ["entry", "selection", "history", "property"]
display_region = "file_manager_window.content_pane"

[policy]
page_navigation_updates_history = true
entry_view_configuration_preserves_page_identity = true
selection_updates_are_scoped_to_current_page = true
split_pane_keeps_independent_page_contexts = true

[user_visible_status]
allowed = [
  "navigate_pages_applied",
  "go_page_history_back_applied",
  "forward_page_history_applied",
  "show_page_history_applied",
  "go_to_enclosing_directory_applied",
  "view_current_page_title_applied",
  "reload_directory_page_on_external_change_applied",
  "set_entries_view_as_list_table_applied",
  "set_entries_view_as_icon_grid_applied",
  "set_entries_view_as_column_applied",
  "set_entries_view_as_graph_applied",
  "group_entries_by_property_applied",
  "sort_entrires_by_property_applied",
  "show_hide_hidden_entry_applied",
  "customize_list_view_column_applied",
  "view_entry_counts_in_current_page_applied",
  "show_selected_entry_counts_applied",
  "update_entry_selection_applied",
  "split_content_pane_vertically_horizontally_applied",
  "convert_split_pane_orientation_applied",
  "seprated_splited_content_pane_applied",
  "adjust_splited_content_pane_size_applied",
  "switch_focus_between_split_panes_applied",
]
forbidden = []

[status.navigate_pages_applied]
description = "Navigate Pages 결과가 사용자에게 반영된 상태"
entered_by = ["EVM-001-navigate_pages"]
exits_to = []
