[project]
name = "voyager-app-backend"
version = "0.1.0"
description = "Voyager App Backend With FastAPI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi[standard]==0.116.1",
  "hydra-core>=1.3.2",
  "pydantic>=2.11.7",
  "python-dotenv>=1.1.1",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
  "ipykernel>=6.30.1",
  "mypy>=1.17.1",
  "ruff>=0.7.0",
  "uv>=0.8.13",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["FAST"]
extend-select = ["I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.13"
disallow_any_expr = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "app"

[project.scripts]
dev = "app.cli:dev"
prod = "app.cli:prod"
