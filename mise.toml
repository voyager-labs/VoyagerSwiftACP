'''


[tasks.entry-core-swift-test]
description = "VoyagerEntryCoreClient unit 테스트 (process smoke 제외)"
run = "xcrun swift test --package-path apps/macos/Packages/06_Shared/VoyagerEntryCoreClient --skip VoyagerEntryCoreProcessSmokeTests"

[tasks.entry-core-swift-smoke]
description = "실제 Entry Core daemon 기반 VoyagerEntryCoreClient process smoke 테스트"
run = '''
set -eu
temp_root="$(mktemp -d /tmp/ec-swift.XXXXXX)"
trap 'rm -rf "$temp_root"' EXIT
daemon_path="$temp_root/entry-core-daemon"
(
  cd apps/entry-core
  go build -o "$daemon_path" ./cmd/entry-core-daemon
)
test -x "$daemon_path"
export VOYAGER_ENTRY_CORE_DAEMON_PATH="$daemon_path"
xcrun swift test \
  --package-path apps/macos/Packages/06_Shared/VoyagerEntryCoreClient \
  --filter VoyagerEntryCoreProcessSmokeTests
'''

[tasks.entry-core-interop-check]
description = "Entry Core Go 검사와 Swift unit/process smoke를 순차 검증"
run = '''
set -eu
mise run entry-core-check
mise run entry-core-swift-test
mise run entry-core-swift-smoke
'''

[tasks.storybook]
description = "Storybook 개발 서버 실행 (기본 포트: 6006)"
run = "cd apps/storybook && pnpm storybook \"$@\""

[tasks.storybook-setup]
description = "Storybook pnpm 의존성 동기화"
run = "pnpm --dir apps/storybook install --frozen-lockfile"

[tasks.swiftui-tokens]
description = "SwiftUI system color와 material metadata를 Storybook에 동기화"
run = """
xcrun swift run \
  --package-path apps/macos/Packages/06_Shared/VoyagerShared \
  VoyagerDesignTokenExporter \
  --css-output apps/storybook/packages/file-manager-illustration/src/styles/macos-tokens.css \
  --metadata-output apps/storybook/packages/file-manager-illustration/src/foundations/swiftui-material-metadata.generated.ts \
  "$@"
"""
