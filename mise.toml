# Voyager App — mise.toml
# 사용법: mise tasks (목록), mise run <task> (실행)

# ── Tools (pinned versions) ───────────────────────────────────

[tools]
lefthook = "2.1.9"
swiftlint = "0.63.3"
xcodes = "1.6.2"
python = "3.13"
uv = "0.8.13"

# SwiftFormat: GitHub releases backend
[tools."github:nicklockwood/SwiftFormat"]
version = "0.61.1"
rename_exe = "swiftformat"
no_app = true

# Cupertino: Apple Docs MCP (GitHub release)
[tools."github:mihaelamj/cupertino"]
version = "1.3.0"

# CodeGraph: semantic code intelligence (npm)
[tools."npm:@colbymchenry/codegraph"]
version = "0.9.6"

# XcodeBuildMCP: Xcode build/test MCP (npm)
[tools."npm:xcodebuildmcp"]
version = "2.6.2"

# xcbeautify: xcodebuild log 파서/필터 (GitHub release)
[tools."github:cpisciotta/xcbeautify"]
version = "3.2.1"

# RTK: Rust Token Killer — build/command log token 최적화 (GitHub release)
[tools."github:rtk-ai/rtk"]
version = "0.42.3"

# Periphery: Swift 미사용 코드 탐지 (GitHub release)
[tools."github:peripheryapp/periphery"]
version = "3.7.4"

# ast-grep: AST 기반 코드 검색/rewrite (GitHub release)
[tools."github:ast-grep/ast-grep"]
version = "0.43.0"

# ── Tasks ─────────────────────────────────────────────────────

# 온보딩: clone 후 한 번 실행
[tasks.setup]
description = "온보딩: clone 후 한 번 실행"
run = """
mise install
bash scripts/xcodes.sh
lefthook install
git submodule update --init --recursive
mise run codegraph-init
"""

# .xcode-version 기준 Xcode 설치 및 선택
[tasks.xcode]
description = ".xcode-version 기준 Xcode 설치 및 선택"
run = "bash scripts/xcodes.sh"

# Git hooks 설치 (Lefthook)
[tasks.hooks]
description = "Git hooks 설치 (Lefthook)"
run = "lefthook install"

# Submodule 초기화
[tasks.submodules]
description = "Submodule 초기화"
run = "git submodule update --init --recursive"

# macOS 개발 앱 빌드 (공유 package cache와 worktree-local build/dev payload, xcbeautify 필터링)
[tasks.macos-build]
description = "macOS 개발 앱 빌드 (xcbeautify 필터링)"
run = """
set -o pipefail
mkdir -p build/dev/reports
NSUnbufferedIO=YES scripts/dev/xcodebuild-branch-product.sh -project apps/macos/Voyager/Voyager.xcodeproj -scheme Voyager-Dev -configuration Dev-Debug -skipPackagePluginValidation -skipMacroValidation COMPILER_INDEX_STORE_ENABLE=NO build 2>&1 | tee build/dev/xcodebuild.log | mise exec -- xcbeautify --quiet --is-ci --report junit --report-path build/dev/reports
"""

# macOS 앱/호스트 빌드 후 실행 (worktree 내부 DerivedData 사용)
[tasks.macos-launch]
description = "macOS 앱/호스트 빌드 후 실행 (기본: Voyager-Dev Dev-Debug)"
run = """
if [ "$#" -eq 0 ]; then
  set -- --scheme Voyager-Dev --configuration Dev-Debug --env "VOYAGER_PROJECT_ROOT=$PWD"
fi
scripts/dev/macos-launch.sh "$@"
"""

[tasks.macos-filemanager-injection]
description = "FileManagerHost Dev-Debug를 InjectionNext와 함께 빌드 후 실행"
run = """
scripts/dev/macos-launch.sh \
  --workspace apps/macos/Hosts/FileManagerHost/FileManagerHost.xcodeproj/project.xcworkspace \
  --scheme FileManagerHost-Dev \
  --configuration Dev-Debug \
  --injection-next \
  --env "VOYAGER_PROJECT_ROOT=$PWD" \
  "$@"
"""

# macOS 개발 앱 테스트 (worktree 내부 DerivedData 사용, xcbeautify 필터링)
[tasks.macos-test]
description = "macOS 개발 앱 테스트 (xcbeautify 필터링)"
run = "scripts/dev/macos-test.sh \"$@\""

[tasks.macos-cache-report]
description = "macOS Xcode hybrid cache usage report (worktree payload + shared packages)"
run = "python3 scripts/dev/xcodebuild_cache.py report \"$@\""

[tasks.macos-cache-prune]
description = "macOS Xcode hybrid cache dry-run prune (use --apply to delete eligible local payloads)"
run = "python3 scripts/dev/xcodebuild_cache.py prune \"$@\""

# macOS 개발 앱 flow 테스트 (focused PRODUCT flow 실행)
[tasks.macos-test-flow]
description = "macOS PRODUCT flow 테스트 (focused 실행)"
run = "python3 scripts/dev/macos_test_flow.py \"$@\""

# Xcode 툴체인의 Swift 버전 확인
[tasks.swift-version]
description = "Xcode 툴체인의 Swift 버전 확인"
run = "python3 scripts/dev/check_swift_version.py"

# Git hooks 재설치 (강제)
[tasks.reinstall-hooks]
description = "Git hooks 재설치 (강제)"
run = "lefthook install --force"

[tasks.validate-harness]
description = "에이전트 하네스 구조 검증"
run = "python3 -m scripts.validate_harness"

[tasks.verify-plan]
description = "계획 Markdown 구조 검증"
run = "python3 -m scripts.verify_plan"

[tasks.storybook]
description = "Storybook 개발 서버 실행 (기본 포트: 6006)"
run = "cd apps/storybook && pnpm storybook \"$@\""

# ── CodeGraph ─────────────────────────────────────────────────

[tasks.codegraph-init]
description = "CodeGraph 인덱스 초기화 (최초 1회)"
run = "mise exec -- codegraph init -i"

[tasks.codegraph-serve]
description = "CodeGraph MCP 서버 실행"
run = "mise exec -- codegraph serve --mcp"

[tasks.codegraph-reindex]
description = "CodeGraph 인덱스 재구축"
run = "mise exec -- codegraph index"

[tasks.codegraph-clean]
description = "CodeGraph 인덱스/캐시 삭제"
run = "rm -rf .codegraph"

[tasks.codegraph-status]
description = "CodeGraph 인덱스 상태 확인"
run = "mise exec -- codegraph status"
