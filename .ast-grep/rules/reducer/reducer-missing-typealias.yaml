id: reducer-missing-typealias
language: swift
severity: warning
message: 비단순 reducer는 직접 멤버 State/Action alias를 모두 제공하세요. 작은 inline reducer는 소유권 리뷰로
  판단합니다.
note: Policy diagnostic, not a TCA compiler requirement. Only direct members count;
  either missing alias is reported.
rule:
  all:
  - kind: class_declaration
    has:
      kind: modifiers
      has:
        pattern: '@Reducer'
        stopBy: end
  - any:
    - not:
        has:
          field: body
          kind: class_body
          has:
            kind: typealias_declaration
            has:
              field: name
              regex: ^State$
    - not:
        has:
          field: body
          kind: class_body
          has:
            kind: typealias_declaration
            has:
              field: name
              regex: ^Action$
