id: nested-state-in-reducer
language: swift
severity: warning
message: inline State/Action의 크기와 소유권을 검토하세요. 단순 타입을 파일 길이만으로 분해하지 마세요.
note: Review signal only. A nested child declaration is not a direct State/Action
  of its parent.
rule:
  all:
  - kind: class_declaration
    has:
      kind: modifiers
      has:
        pattern: '@Reducer'
        stopBy: end
  - has:
      field: body
      kind: class_body
      has:
        kind: class_declaration
        has:
          field: name
          regex: ^(State|Action)$
