id: action-missing-casepathable
language: swift
severity: error
message: "Action enum에 @CasePathable 속성이 누락되었습니다."
note: >
  Every Action enum must be annotated with @CasePathable and conform to CasePathable.
  TCA's Scope, IfLet, and Switch all rely on CasePathable for key-path-based decomposition.
  Correct:
    @CasePathable
    public enum MyAction: CasePathable, Sendable { ... }
rule:
  kind: class_declaration
  has:
    field: name
    regex: "Action$"
  not:
    has:
      stopBy: end
      pattern: "@CasePathable"
