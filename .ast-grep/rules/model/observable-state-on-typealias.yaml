id: observable-state-on-typealias
language: swift
severity: error
message: '@ObservableState는 typealias가 아니라 실제 State 선언에 적용하세요.'
note: Annotate the concrete declaration, not its alias. Compiler remains authoritative
  for macro validity.
rule:
  kind: typealias_declaration
  has:
    pattern: '@ObservableState'
    stopBy: end
