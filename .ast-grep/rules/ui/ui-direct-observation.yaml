id: ui-direct-observation
language: swift
severity: error
message: Ui의 도메인·시스템 관찰은 reducer/client로 이동하세요. Coordinator의 물리 UI 관찰은 mount/unmount에서
  정리하세요.
note: Distributed observation is forbidden in Ui. The named Coordinator allowance
  covers native geometry plumbing only, not domain work. It is a syntactic allowance,
  not proof of lifecycle ownership; verify teardown and late callbacks in tests. Do
  not create clients solely to wrap scroll notifications.
rule:
  any:
  - pattern: DistributedNotificationCenter.default()
  - pattern: NotificationCenter.default
    not:
      inside:
        kind: class_declaration
        has:
          field: name
          regex: Coordinator$
        stopBy: end
