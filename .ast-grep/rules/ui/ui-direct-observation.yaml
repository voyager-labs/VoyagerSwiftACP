id: ui-direct-observation
language: swift
severity: error
message: "Ui 파일에서 NotificationCenter를 직접 사용하지 마세요. Reducer-owned observation을 사용하세요."
note: >
  Observation (NotificationCenter, Timer, etc.) must be owned by the Reducer, not the View.
  Views should only send lifecycle events; actual observation logic belongs in Reducer effects.
  Instead:
    - Encapsulate observation in a DependencyClient
    - Start/stop observation in Reducer .run effects
    - Views only call store.send(.view(.startObserving))
  Exception: NotificationCenter.default is allowed inside `class Coordinator` / `final class Coordinator`
  within NSViewRepresentable types. Coordinators handle UI geometry observation (e.g. scroll bounds)
  which is AppKit plumbing, not reducer-owned system lifecycle.
  DistributedNotificationCenter.default() remains forbidden everywhere in Ui — no exception.
  Implementation: uses ast-grep relational `not` + `inside` with `stopBy: end` to exclude matches
  nested inside any class_declaration whose name matches "Coordinator".
  Scan: sg scan --rule .ast-grep/rules/ui/ui-direct-observation.yaml **/Ui/*.swift
rule:
  any:
    - pattern: "DistributedNotificationCenter.default()"
    - pattern: "NotificationCenter.default"
      not:
        inside:
          stopBy: end
          kind: class_declaration
          regex: "Coordinator"
