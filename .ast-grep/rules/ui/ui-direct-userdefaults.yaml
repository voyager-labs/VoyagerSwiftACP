id: ui-direct-userdefaults
language: swift
severity: error
message: Ui에서 UserDefaults에 직접 접근하지 마세요. 의미 있는 view action을 보내고 owner reducer가 저장
  client를 호출해야 합니다.
note: Do not fix this by moving persistence work into a view-local @Dependency. Pass
  immutable presentation input or a semantic action.
rule:
  pattern: UserDefaults.standard
