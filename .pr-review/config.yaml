profile: assertive
language: ko-KR

# ── Phase 1: Skip Conditions ──
auto_review:
  base_branches: [develop, main]
  ignore_branches:
    - "revert-*"
    - "*revert-*"
    - "revert/**"
    - "**/revert-*"
    - "**/*revert-*"
    - "**/revert/**"
    - "automation/voyager-docs-sync-*"
  ignore_labels:
    - skip-greptile
    - no-greptile
    - skip-review
    - no-review
    - duplicate-diff
    - duplicate-pr
  ignore_keywords:
    - "This reverts commit"
    - "skip-greptile"
    - "no-greptile"
    - "skip-review"
    - "duplicate-diff"
    - "duplicate-pr"

# ── Phase 2: Path Filters ──
path_filters:
  - "!docs/canonical/**"
  - "!docs/**"
  - "!README.md"
  - "!README.*.md"
  - "!**/*.generated.*"
  - "!build/**"
  - "!DerivedData/**"
  - "!**/__snapshots__/**"
  - "!**/coverage/**"
  - "!vendor/**"
  - "!node_modules/**"

# ── Phase 4: Path Instructions ──
path_instructions:
  - path: "apps/storybook/**"
    instructions_file: "rules/storybook.md"

  # macOS Swift — extensive architecture rules in external file
  - path: "apps/macos/**/*.swift"
    instructions_file: "rules/macos-swift.md"

  # Global rules — apply to all files
  - path: "**"
    instructions: |
      ## Severity and noise policy

      Only leave comments for P0/P1-level issues by default:
      - P0: blocker, data loss, security issue, crash, or severe architectural breakage.
      - P1: high-confidence correctness, lifecycle, ownership, boundary, or maintainability risk.

      `apps/storybook/**` is the only exception. Its routed instructions may add
      non-blocking P2 design-polish notes. Do not use P2 for any other path.

      Do not comment on:
      - Formatting, import ordering, naming nits, minor style preferences
      - Obvious type errors or build failures that CI would immediately catch
      - Test failures that CI would immediately surface
      - Low-confidence speculation
      - Generic "consider refactoring" suggestions without concrete evidence

      When multiple symptoms share one root cause, leave one consolidated comment
      at the strongest representative location.

      ## Scope and canonical context gate

      Before leaving a P0/P1 finding, confirm it is in the PR's review scope:
      - The issue violates the Linear acceptance criteria, canonical docs/specs,
        PR intent, or behavior introduced by the PR diff.
      - If the concern is outside that scope, do not mark it blocking; record it
        only as a follow-up if useful.

      When the PR is tied to product/spec work, keep the relevant
      `docs/canonical` contracts in review context even if docs paths are
      filtered from inline comments. If a docs submodule pointer changes, verify
      whether it changes the spec baseline used to judge the app diff.

      Every comment must explain:
      1. What is wrong.
      2. Why it matters for this repository.
      3. Which existing pattern/module/type should be reused or extended.
      4. What concrete alternative would fit the codebase better.

      ## Local-only artifacts

      The following paths are local agent/runtime artifacts:
      - .omo/**
      - .omx/**
      - .sisyphus/**
      - .codegraph/**

      They must not be tracked, staged, committed, or included in PRs.
      If these appear in a PR, leave a high-severity repository hygiene comment.

      ## Comment format

      Use this format for findings:

      [P1] <short Korean finding title>

      <왜 문제가 되는지 한국어로 설명. 이 레포의 구조/소유권/재사용 관점에서 구체적으로 설명.>

      Evidence:
      - `<path>`: <relevant symbol or behavior>
      - Existing pattern to reuse: `<path or type>`

      Suggested direction:
      - <concrete alternative>

# ── Phase 3: Tools ──
tools:
  ast-grep:
    enabled: true
    languages: [swift, typescript, tsx, python]
  codegraph:
    enabled: true
  lsp:
    enabled: true
  swiftlint:
    enabled: true
    config_file: "apps/macos/.swiftlint.yml"

# ── Phase 5: Output ──
output:
  severity_levels: [P0, P1, P2]
  evidence_required: true
  review_footer: true
