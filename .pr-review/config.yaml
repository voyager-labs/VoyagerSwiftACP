profile: assertive
language: ko-KR

# ── Phase 1: Skip Conditions ──
auto_review:
  base_branches: [develop, main]
  ignore_branches:
    - "revert-*"
    - "*revert-*"
    - "revert/**"
    - "**/revert-*"
    - "**/*revert-*"
    - "**/revert/**"
    - "automation/voyager-docs-sync-*"
  ignore_labels:
    - skip-greptile
    - no-greptile
    - skip-review
    - no-review
    - duplicate-diff
    - duplicate-pr
  ignore_keywords:
    - "This reverts commit"
    - "skip-greptile"
    - "no-greptile"
    - "skip-review"
    - "duplicate-diff"
    - "duplicate-pr"

# ── Phase 2: Path Filters ──
path_filters:
  - "!docs/canonical/**"
  - "!docs/**"
  - "!README.md"
  - "!README.*.md"
  - "!**/*.generated.*"
  - "!build/**"
  - "!DerivedData/**"
  - "!**/__snapshots__/**"
  - "!**/coverage/**"
  - "!vendor/**"
  - "!node_modules/**"

# ── Phase 4: Path Instructions ──
path_instructions:
  # macOS Swift — extensive architecture rules in external file
  - path: "apps/macos/**/*.swift"
    instructions_file: "rules/macos-swift.md"

  # Backend Python — shorter inline rules
  - path: "apps/backend/**/*.py"
    instructions: |
      # Backend — FastAPI + Pydantic

      When a PR touches backend routes, request/response schemas, search conversion,
      or API clients, verify the observable contract:

      - Response envelopes, status codes, and error shapes remain compatible with
        existing clients.
      - Internal exceptions, tracebacks, filesystem paths, and provider details are
        not exposed as raw API responses.
      - Search conversion endpoints preserve the documented convert-only contract;
        do not introduce implicit indexing, filesystem mutation, or app-runtime
        coupling through backend APIs.
      - Schema/model changes include matching route behavior and tests for success,
        validation failure, and provider/backend failure paths.

      Tools: ruff (lint), pyright (types).
      Flag API contract drift as P1 correctness or compatibility risk.

  # Global rules — apply to all files
  - path: "**"
    instructions: |
      ## Severity and noise policy

      Only leave comments for P0/P1-level issues:
      - P0: blocker, data loss, security issue, crash, or severe architectural breakage.
      - P1: high-confidence correctness, lifecycle, ownership, boundary, or maintainability risk.

      Do not comment on:
      - Formatting, import ordering, naming nits, minor style preferences
      - Obvious type errors or build failures that CI would immediately catch
      - Test failures that CI would immediately surface
      - Low-confidence speculation
      - Generic "consider refactoring" suggestions without concrete evidence

      When multiple symptoms share one root cause, leave one consolidated comment
      at the strongest representative location.

      Every comment must explain:
      1. What is wrong.
      2. Why it matters for this repository.
      3. Which existing pattern/module/type should be reused or extended.
      4. What concrete alternative would fit the codebase better.

      ## Local-only artifacts

      The following paths are local agent/runtime artifacts:
      - .omx/**
      - .sisyphus/**

      They must not be tracked, staged, committed, or included in PRs.
      If these appear in a PR, leave a high-severity repository hygiene comment.

      ## Comment format

      Use this format for findings:

      [P1] <short Korean finding title>

      <왜 문제가 되는지 한국어로 설명. 이 레포의 구조/소유권/재사용 관점에서 구체적으로 설명.>

      Evidence:
      - `<path>`: <relevant symbol or behavior>
      - Existing pattern to reuse: `<path or type>`

      Suggested direction:
      - <concrete alternative>

# ── Phase 3: Tools ──
tools:
  ast-grep:
    enabled: true
    languages: [swift, typescript, tsx, python]
  codegraph:
    enabled: true
    status_command: "mise run codegraph-status"
  lsp:
    enabled: true
  swiftlint:
    enabled: true
    config_file: "apps/macos/.swiftlint.yml"
  ruff:
    enabled: true
  pyright:
    enabled: true

# ── Phase 5: Output ──
output:
  severity_levels: [P0, P1]
  evidence_required: true
  review_footer: true
